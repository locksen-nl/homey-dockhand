<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 24px 20px; background: #fff; color: #111; }

    h2 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    p.sub { font-size: 13px; color: #666; margin-bottom: 22px; line-height: 1.5; }

    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #333; }
    label span { font-weight: 400; color: #999; }
    input {
      width: 100%; padding: 11px 12px;
      border: 1.5px solid #ddd; border-radius: 8px;
      font-size: 14px; margin-bottom: 16px; outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #14B8A6; }

    .error {
      background: #fff0f0; border: 1px solid #fca5a5;
      border-radius: 8px; padding: 10px 12px;
      font-size: 13px; color: #c00;
      margin-bottom: 16px; display: none; line-height: 1.5;
    }

    button {
      width: 100%; padding: 13px;
      background: #14B8A6; color: #fff;
      border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700; cursor: pointer;
    }
    button:disabled { background: #aaa; cursor: not-allowed; }
  </style>
</head>
<body>

  <h2>Connect to Dockhand</h2>
  <p class="sub">Enter your Dockhand URL and credentials. Leave username and password empty if authentication is disabled.</p>

  <div class="error" id="err"></div>

  <label>Dockhand URL</label>
  <input id="url" type="url" placeholder="http://192.168.1.100:3000" autocomplete="off" />

  <label>Username <span>(optional)</span></label>
  <input id="username" type="text" placeholder="admin" autocomplete="off" />

  <label>Password <span>(optional)</span></label>
  <input id="password" type="password" placeholder="••••••••" autocomplete="new-password" />

  <button id="btn" onclick="connect()">Connect</button>

  <script>
    function connect() {
      var url      = document.getElementById('url').value.trim().replace(/\/$/, '');
      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value;
      var btn      = document.getElementById('btn');
      var err      = document.getElementById('err');

      err.style.display = 'none';

      if (!url) {
        err.textContent = 'Please fill in the Dockhand URL.';
        err.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Connecting...';

      Homey.emit('validate', { url: url, username: username, password: password })
        .then(function() {
          Homey.nextView();
        })
        .catch(function(e) {
          btn.disabled = false;
          btn.textContent = 'Connect';
          err.textContent = (e && e.message) ? e.message : 'Could not connect to Dockhand.';
          err.style.display = 'block';
        });
    }
  </script>

</body>
</html>
