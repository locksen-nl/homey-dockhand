<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./index.css">
</head>
<body>
  <div id="app">
    <div class="header">
      <div class="header-left">
        <svg class="logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="2.5" fill="#14B8A6"/>
          <circle cx="12" cy="12" r="6" fill="none" stroke="#14B8A6" stroke-width="1.5"/>
          <line x1="12" y1="6" x2="12" y2="1" stroke="#14B8A6" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="12" y1="18" x2="12" y2="23" stroke="#14B8A6" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="6" y1="12" x2="1" y2="12" stroke="#14B8A6" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="18" y1="12" x2="23" y2="12" stroke="#14B8A6" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="7.76" y1="7.76" x2="4.34" y2="4.34" stroke="#14B8A6" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="16.24" y1="16.24" x2="19.66" y2="19.66" stroke="#14B8A6" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="16.24" y1="7.76" x2="19.66" y2="4.34" stroke="#14B8A6" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="7.76" y1="16.24" x2="4.34" y2="19.66" stroke="#14B8A6" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span class="title">Dockhand</span>
      </div>
      <div class="header-right">
        <button class="filter-btn" id="filter-btn" title="Show running only">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z"/></svg>
        </button>
        <div class="summary" id="summary">—</div>
      </div>
    </div>

    <div class="env-bar-wrap" id="env-bar-wrap" style="display:none">
      <div class="env-bar" id="env-bar"></div>
    </div>

    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 16 16" fill="currentColor">
        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
      </svg>
      <input type="text" id="search" placeholder="Search containers..." autocomplete="off" />
    </div>

    <div class="list" id="list">
      <div class="placeholder">Loading...</div>
    </div>

    <div class="footer" id="footer"></div>
  </div>

  <script src="./index.js"></script>
</body>
</html>
